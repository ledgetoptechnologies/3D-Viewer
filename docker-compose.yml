x-runtime: &runtime
  image: ${VIEWER_IMAGE:?VIEWER_IMAGE must be pinned to a CI sha tag or digest}
  pull_policy: always
  restart: unless-stopped
  # Updates drain active work first. This gives current database/filesystem
  # operations time to finish before Docker sends SIGKILL.
  stop_grace_period: 2m
  init: true
  read_only: true
  # TrueNAS SCALE Apps service identity. Storage is a Docker-managed named
  # volume initialized with this ownership by the image; no startup chown.
  user: "568:568"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  env_file:
    - ${VIEWER_ENV_FILE:-/mnt/Plugins/App_Data/Model-Viewer/Config/viewer.env}
  tmpfs:
    - "/tmp:rw,noexec,nosuid,nodev,size=256m"
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  environment: &runtime-env
    PORT: 8088
    EMERGENCY_ADMIN_ENABLED: "false"
    PROCESSING_PLATFORM_ENABLED: ${PROCESSING_PLATFORM_ENABLED:-true}
    LOCAL_DERIVATIVES_ENABLED: "false"
    DATA_DIR: /app/storage/data
    DATABASE_PATH: /app/storage/data/viewer.sqlite
    DATASETS_MOUNT: /app/storage/datasets
    MODELS_MOUNT: /app/storage/models
    CACHE_MOUNT: /app/storage/cache
    TRASH_MOUNT: /app/storage/trash
    DATASET_IMPORT_MOUNT: /app/storage/imports/datasets
    TERRA_IMPORT_MOUNT: /app/storage/imports/terra
    WEBODM_MEDIA_MOUNT: /imports/webodm
    DERIVATIVES_MOUNT: /imports/legacy-derivatives
    X_ACCEL_REDIRECT_PREFIX: ""
  volumes: &runtime-volumes
    - viewer_storage:/app/storage
    - /mnt/Plugins/App_Data/WebODM/Media:/imports/webodm:ro
    - /mnt/Plugins/App_Data/Model-Viewer/Derivatives:/imports/legacy-derivatives:ro

services:
  viewer-api:
    <<: *runtime
    ports: ["${VIEWER_BIND_ADDRESS:-192.168.50.80}:${VIEWER_PORT:-8088}:8088"]
    healthcheck:
      test: [CMD, node, scripts/container-healthcheck.js]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  viewer-worker:
    <<: *runtime
    command: [node, server/worker.js]
    healthcheck:
      test: [CMD, node, -e, "const {config}=require('./server/config');const {openDatabase}=require('./server/database');const db=openDatabase(config.databasePath);const row=db.prepare(\"SELECT value FROM app_state WHERE key='processing_worker_heartbeat'\").get();db.close();const value=row&&JSON.parse(row.value);if(!value||Date.parse(value.at)<=Date.now()-30000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  viewer_storage:
    # Fixed global name keeps the volume stable across TrueNAS app/project
    # renames and mirrors Project Alpha's Docker-managed persistence model.
    name: ltds-viewer-storage

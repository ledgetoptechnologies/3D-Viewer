services:
  ltds-viewer:
    build: .
    image: ltds-3d-viewer:latest
    restart: unless-stopped
    ports:
      - "${VIEWER_PORT:-8080}:8080"
    environment:
      PORT: 8080
      WEBODM_API_URL: ${WEBODM_API_URL}
      WEBODM_USERNAME: ${WEBODM_USERNAME}
      WEBODM_PASSWORD: ${WEBODM_PASSWORD}
      WEBODM_MEDIA_MOUNT: /mnt/webodm
      DERIVATIVES_MOUNT: /mnt/derivatives
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      # READ-ONLY: WebODM's media/output storage.
      #
      # WEBODM_MEDIA_PATH must be the SAME underlying directory that WebODM's
      # own docker-compose.yml bind-mounts as `${WO_MEDIA_DIR}:/webodm/app/media`
      # into its webapp/worker containers (i.e. WebODM's Django MEDIA_ROOT,
      # NOT the unused `appmedia` named volume some WebODM compose files
      # declare but never actually use). Find the real value by running, on
      # the WebODM host, in the directory containing WebODM's docker-compose.yml:
      #   grep WO_MEDIA_DIR .env
      # WebODM runs on a separate host from this viewer, so that directory
      # (or the TrueNAS export it's itself mounted from) must be re-exported
      # (NFS/SMB) and mounted onto THIS Docker host before `docker compose up`
      # — see README "Read-only WebODM access". Never mount WO_DB_DIR (Postgres
      # data) or anything else from WebODM's compose file.
      # This container never gets WebODM's Postgres data, secrets, or
      # application source; only completed task output files, read-only.
      - ${WEBODM_MEDIA_PATH}:/mnt/webodm:ro
      # Optional writable cache for pre-built LOD-mesh-tile/EPT derivatives.
      # Deliberately a SEPARATE path from WebODM's own storage so WebODM
      # upgrades/cleanup can never touch it. Safe to leave pointed at an
      # empty directory if you don't have derivatives yet.
      - ${DERIVATIVES_PATH:-./data/derivatives}:/mnt/derivatives
      # Viewer's own small JSON metadata store (cached sync results only —
      # never a copy of WebODM's database).
      - viewer-data:/app/data

volumes:
  viewer-data:

services:
  ltds-viewer:
    image: ${VIEWER_IMAGE:-ghcr.io/ledgetoptechnologies/3d-viewer:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ports:
      - "${VIEWER_PORT:-8088}:8088"
    environment:
      PORT: 8088
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://viewer.ledgetopdroneservices.com}
      EXPECTED_HOST: ${EXPECTED_HOST:-viewer.ledgetopdroneservices.com}
      OPS_BASE_URL: ${OPS_BASE_URL:-https://ops.ledgetopdroneservices.com}
      ALLOWED_EMBED_ORIGINS: ${ALLOWED_EMBED_ORIGINS:-https://ops.ledgetopdroneservices.com,https://client.ledgetopdroneservices.com}
      # cloudflared -> container is one trusted proxy. Use 2 only if Nginx is
      # deliberately inserted between cloudflared and this container.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SERVICE_AUTH_KEY_ID: ${SERVICE_AUTH_KEY_ID:-ops-v1}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set a random SERVICE_AUTH_SECRET of at least 32 characters}
      SERVICE_AUTH_KEYS_JSON: ${SERVICE_AUTH_KEYS_JSON:-}
      SERVICE_AUTH_PREVIOUS_KEY_ID: ${SERVICE_AUTH_PREVIOUS_KEY_ID:-}
      SERVICE_AUTH_PREVIOUS_SECRET: ${SERVICE_AUTH_PREVIOUS_SECRET:-}
      # Administration is owned by LTDS Ops. The legacy local password shell
      # is intentionally unavailable in this deployment profile.
      EMERGENCY_ADMIN_ENABLED: "false"
      # Prefer the LAN endpoint so discovery traffic stays local. Override
      # with https://webodm.ledgetopdroneservices.com only when the container
      # cannot route to the WebODM host.
      WEBODM_API_URL: ${WEBODM_API_URL:-http://192.168.50.80:30048}
      WEBODM_USERNAME: ${WEBODM_USERNAME:-Model-Viewer}
      WEBODM_PASSWORD: ${WEBODM_PASSWORD:?set the dedicated Model-Viewer WebODM password}
      WEBODM_ENABLED: ${WEBODM_ENABLED:-true}
      WEBODM_MEDIA_MOUNT: /mnt/webodm
      DERIVATIVES_MOUNT: /mnt/derivatives
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      SESSION_SECRET: ${SESSION_SECRET:?set a random SESSION_SECRET of at least 32 characters}
      DATABASE_PATH: /app/data/viewer.sqlite
      VIEWER_SESSION_TTL_SECONDS: ${VIEWER_SESSION_TTL_SECONDS:-1800}
      SESSION_GRANT_TTL_SECONDS: ${SESSION_GRANT_TTL_SECONDS:-60}
      X_ACCEL_REDIRECT_PREFIX: ${X_ACCEL_REDIRECT_PREFIX:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # READ-ONLY: WebODM's media/output storage.
      #
      # TrueNAS host paths are fixed for this internal application. WebODM
      # output and prebuilt derivatives are always read-only to the Viewer.
      - /mnt/Plugins/App_Data/WebODM/Media:/mnt/webodm:ro
      - /mnt/Plugins/App_Data/Model-Viewer/Derivatives:/mnt/derivatives:ro
      # SQLite registry, sessions, shares, imports, and migration state.
      - /mnt/Plugins/App_Data/Model-Viewer/Data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

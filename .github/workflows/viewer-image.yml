name: Viewer image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: viewer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # metadata-action's automatic semver flavor otherwise emits
          # `latest` for version tags even when the explicit raw tag is off.
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VIEWER_SOURCE_COMMIT=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify published immutable image
        if: github.event_name == 'push'
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${PUBLISHED_IMAGE##*@}"
          docker pull "$PUBLISHED_IMAGE"
          test "$(docker inspect --format '{{.Config.User}}' "$PUBLISHED_IMAGE")" = "568:568"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$PUBLISHED_IMAGE")" = "$EXPECTED_REVISION"
          docker run --rm --entrypoint sh -e EXPECTED_REVISION="$EXPECTED_REVISION" "$PUBLISHED_IMAGE" -c \
            'test "$(cat /app/source-commit.txt)" = "$EXPECTED_REVISION" && test "$(stat -c %a /app/source-commit.txt)" = 444'
          printf 'Verified immutable image `%s`\n' "$PUBLISHED_IMAGE" >> "$GITHUB_STEP_SUMMARY"

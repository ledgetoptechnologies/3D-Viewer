<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening LTDS Viewer…</title>
  <style>html,body{height:100%;margin:0;background:#08080a;color:#f5f5f5;font:16px system-ui,sans-serif}main{height:100%;display:grid;place-content:center;text-align:center;gap:12px}.dot{width:30px;height:30px;margin:auto;border:4px solid #333;border-top-color:#EE5007;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <main><div class="dot" aria-hidden="true"></div><p id="status">Opening secure Viewer session…</p></main>
  <script>
    (() => {
      const CHANNEL_PATTERN=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      const channelId=hash.get('channel');
      history.replaceState(null,'',location.pathname);
      if(!CHANNEL_PATTERN.test(channelId||'')||typeof BroadcastChannel!=='function'){
        document.querySelector('#status').textContent='Secure Viewer launch is unavailable.';
        return;
      }
      const channel=new BroadcastChannel(`ltds-viewer-review:${channelId}`);
      channel.onmessage=event=>{
        const message=event.data;
        if(message&&Object.keys(message).sort().join('\n')===['type','version'].sort().join('\n')
          &&message.version===1&&message.type==='ltds-viewer:launch-failed'){
          channel.close();
          document.querySelector('#status').textContent='Secure Viewer launch failed. Close this tab and try again.';
          return;
        }
        if(!message||Object.keys(message).sort().join('\n')!==['type','url','version'].sort().join('\n')
          ||message.version!==1||message.type !== 'ltds-viewer:navigate')return;
        let parsed;
        try{parsed=new URL(message.url)}catch{return;}
        const hashValues=new URLSearchParams(parsed.hash.replace(/^#/,''));
        const controller=hashValues.get('reviewController')||hashValues.get('launchController');
        if(parsed.origin !== location.origin||parsed.username||parsed.password
          ||!/^\/session\/[0-9a-f-]{36}$/i.test(parsed.pathname)||controller!==channelId)return;
        channel.close();
        location.replace(parsed.href);
      };
      channel.postMessage({version:1,type:'ltds-viewer:launcher-ready',channelId});
    })();
  </script>
</body>
</html>

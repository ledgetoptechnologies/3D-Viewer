<!DOCTYPE html>
<html><head></head><body>
<div id="output">Loading...</div>
<script src="/potree/libs/three.js/build/three.min.js"></script>
<script src="/potree/build/potree/potree.js"></script>
<script>
window.addEventListener('load', function() {
  var el = document.getElementById('output');
  var p = window.Potree || {};
  var keys = Object.keys(p).slice(0, 30).join(', ');
  var viewerType = typeof p.Viewer;
  var threeRev = (window.THREE || {}).REVISION || 'undefined';
  el.innerHTML = '<h3>THREE revision: ' + threeRev + '</h3>' +
    '<h3>Potree keys (' + Object.keys(p).length + '):</h3><pre>' + keys + '</pre>' +
    '<h3>Viewer: ' + viewerType + '</h3>' +
    '<h3>loadPointCloud: ' + typeof p.loadPointCloud + '</h3>';
});
</script>
</body></html>

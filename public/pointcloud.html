<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LTDS Point Cloud</title>
  <link rel="stylesheet" href="/potree/build/potree/potree.css">
  <link rel="stylesheet" href="/potree/libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="/potree/libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="/potree/libs/jstree/themes/style.min.css">
  <style>
    :root { --brand-orange: #EE5007; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #050505; font-family: 'Outfit', sans-serif; }
    #potree_render_area { position: absolute; inset: 0; }
    #potree_sidebar_container { display: none; }

    #pc-status {
      position: absolute; bottom: 10px; left: 12px; z-index: 50;
      color: #999; font-size: 11px; background: rgba(10,10,12,0.85);
      border-radius: 6px; padding: 4px 10px;
    }
    #pc-loading {
      position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(5,5,8,0.94); color: #aaa; font-size: 13px;
      transition: opacity 0.4s ease; pointer-events: none;
    }
    #pc-loading.hidden { opacity: 0; }
    #pc-loading.failed { pointer-events: auto; }
    #pc-retry {
      min-width: 92px; min-height: 40px; padding: 8px 16px;
      border: 1px solid rgba(238,80,7,0.75); border-radius: 7px;
      background: #EE5007; color: white; font: inherit; font-weight: 700;
      cursor: pointer;
    }
    #pc-retry:hover { background: #ff641d; }
    #pc-retry:focus-visible { outline: 3px solid white; outline-offset: 2px; }
    #pc-retry[hidden] { display: none; }
    .spinner {
      width: 50px; height: 50px; border-radius: 50%;
      border: 4px solid rgba(238,80,7,0.12); border-top-color: #EE5007;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="potree_render_area"></div>
  <div id="potree_sidebar_container"></div>

  <div id="pc-status">Loading…</div>
  <div id="pc-loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div id="pc-loading-text">Streaming point cloud…</div>
    <button id="pc-retry" type="button" hidden>Retry</button>
  </div>

  <script>
    // Surface bootstrap/resource failures instead of leaving the viewer on an
    // endless loading spinner. This runs before Potree and its dependencies.
    window.__pointCloudDiagnosticContext = (() => {
      const params = new URLSearchParams(location.search);
      const correlationId = params.get('correlation');
      const revision = params.get('revision');
      return {
        correlationId: /^[0-9a-f-]{8,64}$/i.test(correlationId || '') ? correlationId : 'unavailable',
        revision: /^[0-9a-f]{40}$/i.test(revision || '') ? revision.toLowerCase() : 'unavailable',
      };
    })();
    function postPointCloudBootstrapFailure() {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        source: 'ltds-pointcloud', type: 'error', code: 'resource_failed', stage: 'startup',
        correlationId: window.__pointCloudDiagnosticContext.correlationId,
        revision: window.__pointCloudDiagnosticContext.revision,
      }, location.origin);
    }
    function showPointCloudBootstrapError() {
      if (window.__pointCloudHealth) {
        window.__pointCloudHealth.fail('resource_failed');
        return;
      }
      const loadingText = document.getElementById('pc-loading-text');
      const status = document.getElementById('pc-status');
      const loading = document.getElementById('pc-loading');
      const retry = document.getElementById('pc-retry');
      if (loadingText) loadingText.textContent = 'A point-cloud viewer component failed to load. Retry, then check the Viewer image if this continues.';
      if (status) status.textContent = 'Point cloud failed to load';
      loading?.classList.add('failed');
      if (retry) {
        retry.hidden = false;
        retry.onclick = () => location.reload();
      }
      postPointCloudBootstrapFailure();
    }
    window.addEventListener('error', (event) => {
      const isResourceError = event.target && event.target !== window;
      if (window.__pointCloudHealth) window.__pointCloudHealth.fail(isResourceError ? 'resource_failed' : 'runtime_error');
      else showPointCloudBootstrapError();
    }, true);
    window.addEventListener('unhandledrejection', (event) => {
      if (window.__pointCloudHealth) window.__pointCloudHealth.fail('runtime_error');
      else showPointCloudBootstrapError();
    });
  </script>

  <script src="/pointcloud-health.js"></script>
  <script>
    if (!window.LtdsPointCloudHealth?.createPointCloudHealth) {
      showPointCloudBootstrapError();
      throw new Error('point-cloud health runtime unavailable');
    }
    const pointCloudHealth = window.LtdsPointCloudHealth.createPointCloudHealth({
      window,
      document,
      correlationId: window.__pointCloudDiagnosticContext.correlationId,
      buildRevision: window.__pointCloudDiagnosticContext.revision,
    });
    window.__pointCloudHealth = pointCloudHealth;
    pointCloudHealth.beginStartup();
  </script>

  <script src="/potree/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="/potree/libs/three.js/build/three.min.js"></script>
  <script src="/potree/libs/spectrum/spectrum.js"></script>
  <script src="/potree/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="/potree/libs/other/BinaryHeap.js"></script>
  <script src="/potree/libs/tween/tween.min.js"></script>
  <script src="/potree/libs/d3/d3.js"></script>
  <script src="/potree/libs/proj4/proj4.js"></script>
  <script src="/potree/libs/openlayers3/ol.js"></script>
  <script src="/potree/libs/i18next/i18next.js"></script>
  <script src="/potree/libs/jstree/jstree.js"></script>
  <script src="/potree/libs/copc/index.js"></script>
  <script src="/potree/build/potree/potree.js"></script>
  <script src="/potree/libs/plasio/js/laslaz.js"></script>

  <script>
    // Config comes from the parent app (main.js) via the iframe query string —
    // this file no longer hardcodes a project's EPT URL/title/point count.
    const qs = new URLSearchParams(location.search);
    const EPT_URL = qs.get('ept');
    const PROJECT_TITLE = qs.get('title') || 'Point Cloud';
    const POINT_COUNT = qs.get('points') ? parseInt(qs.get('points'), 10) : null;
    const DISPLAY_UNITS = qs.get('units') === 'metric' ? 'm' : 'ft';
    document.title = `LTDS Point Cloud — ${PROJECT_TITLE}`;
    document.getElementById('pc-loading-text').textContent =
      (POINT_COUNT ? `Streaming ${(POINT_COUNT / 1e6).toFixed(0)}M point cloud…` : 'Streaming point cloud…');

    if (!window.Potree?.Viewer) {
      throw new Error('Potree runtime did not initialize');
    }
    const viewer = new Potree.Viewer(document.getElementById('potree_render_area'));
    window.viewer = viewer;
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    // Start at the proven WebODM-friendly baseline. Stronger devices can raise
    // this from the parent controls; auto-LOD still lowers it if frame time
    // degrades while streaming a large legacy EPT tree.
    viewer.setPointBudget(4_000_000);
    viewer.setLengthUnit(DISPLAY_UNITS);
    viewer.setBackground('black');
    viewer.setDescription('');
    viewer.loadSettingsFromURL();

    const view = viewer.scene.view;
    view.minPitch = -Math.PI / 2;
    view.maxPitch = Math.PI / 2;
    viewer.renderer.domElement.tabIndex = 2222;   // needed for keydown (Esc)

    // --------------------------------------------------------------------
    // Budget + device-adaptive LOD
    // --------------------------------------------------------------------
    let cloudMeta = { total: 0, name: 'EPT' };
    const budgetState = {
      target: 4_000_000,      // user-set target (via __pcApi.setBudget only)
      live: 4_000_000,        // what the viewer actually gets; dropped by auto-LOD
      auto: false
    };
    let fpsEMA = 60, lastFrameT = 0;
    (function fpsTrack(t){
      requestAnimationFrame(fpsTrack);
      if (lastFrameT && t > lastFrameT) {
        const inst = 1000 / (t - lastFrameT);
        fpsEMA += (inst - fpsEMA) * 0.1;
      }
      lastFrameT = t;
    })(0);
    setInterval(() => {
      if (fpsEMA < 24 && budgetState.live > 1_500_000) {
        budgetState.live = Math.max(1_500_000, Math.floor(budgetState.live * 0.75));
        viewer.setPointBudget(budgetState.live);
        budgetState.auto = budgetState.live < budgetState.target;
      } else if (fpsEMA > 50 && budgetState.live < budgetState.target) {
        budgetState.live = Math.min(budgetState.target, Math.floor(budgetState.live * 1.25));
        viewer.setPointBudget(budgetState.live);
        budgetState.auto = budgetState.live < budgetState.target;
      }
    }, 2000);

    // --------------------------------------------------------------------
    // Insertion lifecycle tracking shared by the control API and the
    // custom controls below (right-click completes an active insertion).
    // --------------------------------------------------------------------
    const insertionActive = { m: false, v: false };
    viewer.measuringTool.addEventListener('start_inserting_measurement', () => { insertionActive.m = true; });
    viewer.measuringTool.addEventListener('end_inserting_measurement', () => { insertionActive.m = false; });
    viewer.volumeTool.addEventListener('start_inserting_volume', () => { insertionActive.v = true; });
    viewer.volumeTool.addEventListener('end_inserting_volume', () => { insertionActive.v = false; });
    viewer.addEventListener('cancel_insertions', () => { insertionActive.m = false; insertionActive.v = false; });

    // When an insertion starts, MeasuringTool/VolumeTool re-enable the input
    // handler — which would resuscitate earthControls dispatch. Strip
    // earthControls from the listener list again whenever that happens.
    let reenablingIH = false;
    function stripEarthControls() {
      if (reenablingIH) return;
      reenablingIH = true;
      try {
        const ih = viewer.inputHandler;
        ih.enabled = true;                       // insertion markers need drags
        if (ih.inputListeners.includes(viewer.earthControls)) {
          ih.removeInputListener(viewer.earthControls);
        }
      } finally { reenablingIH = false; }
    }
    viewer.measuringTool.addEventListener('start_inserting_measurement', stripEarthControls);
    viewer.measuringTool.addEventListener('end_inserting_measurement', stripEarthControls);
    viewer.volumeTool.addEventListener('start_inserting_volume', stripEarthControls);
    viewer.volumeTool.addEventListener('end_inserting_volume', stripEarthControls);
    viewer.addEventListener('cancel_insertions', stripEarthControls);

    // Live visible-point sample: Potree.numNodesLoading is a non-updating
    // static export and pc.numVisiblePoints only refreshes during node loads,
    // so poll it — same cadence as the status line.
    budgetState.points = 0;
    setInterval(() => {
      const pc = viewer.scene.pointclouds[0];
      if (pc && pc.numVisiblePoints) budgetState.points = pc.numVisiblePoints;
      if (pc && (pc.numVisiblePoints > 0 || (Array.isArray(pc.visibleNodes) && pc.visibleNodes.length > 0))) {
        pointCloudHealth.pointsVisible();
      }
    }, 500);

    // --------------------------------------------------------------------
    // Control API consumed by the parent app's sidebar.
    // --------------------------------------------------------------------
    function eachMat(fn) { for (const pc of viewer.scene.pointclouds) fn(pc.material); }
    window.__pcApi = {
      setBudget(m) {
        const v = Math.max(1, Math.min(20, Number(m))) * 1e6;
        budgetState.target = v;
        budgetState.live = v;
        viewer.setPointBudget(v);
        budgetState.auto = false;
      },
      setSize(v) { eachMat(mat => { mat.size = parseFloat(v); }); },
      setSizing(k) {
        eachMat(mat => {
          if (k === 'adaptive') {
            mat.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            mat.minSize = 1; mat.maxSize = 6;
          } else if (k === 'attenuated') {
            mat.pointSizeType = Potree.PointSizeType.ATTENUATED;
            mat.minSize = 1; mat.maxSize = 12;
          } else {
            mat.pointSizeType = Potree.PointSizeType.FIXED;
            mat.minSize = 0.5; mat.maxSize = 50;
          }
        });
      },
      setColor(a) { eachMat(mat => { mat.activeAttributeName = a; }); },
      setEDL(b) { viewer.setEDLEnabled(!!b); },
      fit() {
        if (viewer.scene.pointclouds.length) viewer.fitToScreen(0.7);
      },
      setTool(t) {
        // finish/cancel whatever is inserting first, then start the new one
        viewer.dispatchEvent({ type: 'cancel_insertions' });
        if (t === 'distance') {
          viewer.measuringTool.startInsertion({ showDistances: true, showArea: false, closed: false, name: 'Distance' });
        } else if (t === 'area') {
          viewer.measuringTool.startInsertion({ showDistances: true, showArea: true, closed: true, name: 'Area' });
        } else if (t === 'volume') {
          viewer.volumeTool.startInsertion({ clip: false });
        }
        // 'none' => just cancelled
      },
      cancel() { viewer.dispatchEvent({ type: 'cancel_insertions' }); },
      clearMeasurements() {
        viewer.dispatchEvent({ type: 'cancel_insertions' });
        // removeAllMeasurements removes measurements + profiles + volumes
        viewer.scene.removeAllMeasurements();
      },
      getStatus() {
        const pc = viewer.scene.pointclouds[0];
        return {
          budgetTarget: budgetState.target,
          budgetLive: budgetState.live,
          fps: Math.round(fpsEMA * 10) / 10,
          points: budgetState.points || (pc ? (pc.numVisiblePoints || 0) : 0),
          auto: budgetState.auto
        };
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.__pcApi.cancel();
    });
    // iframe blur (e.g. parent tab switch): end any stuck drag/pinch
    window.addEventListener('blur', () => { if (pcControls) pcControls._blur(); });

    const statusEl = document.getElementById('pc-status');
    function renderStatus() {
      if (pointCloudHealth.phase() !== 'ready') return;
      const vis = budgetState.points
        ? (budgetState.points >= 1e6
          ? (budgetState.points / 1e6).toFixed(1) + 'M'
          : Math.round(budgetState.points / 1000) + 'k')
        : '—';
      const budg = (budgetState.live / 1e6).toFixed(1).replace(/\.0$/, '');
      const ptsPrefix = cloudMeta.total ? cloudMeta.total.toLocaleString('en-US') + ' pts · ' : '';
      statusEl.textContent =
        ptsPrefix + vis + ' visible · budget ' + budg + 'M' +
        (budgetState.auto ? ' auto' : '') + ' · ' + Math.round(fpsEMA) + ' fps';
    }
    setInterval(renderStatus, 500);

    // --------------------------------------------------------------------
    // View sync API for the parent app (UTM coordinates, shared frame).
    // --------------------------------------------------------------------
    window.__pcViewReady = false;
    let pendingSyncedTarget = null;
    window.__setViewUTM = (camE, camN, camAlt, tgtE, tgtN, tgtAlt) => {
      view.position.set(camE, camN, camAlt);
      view.lookAt(tgtE, tgtN, tgtAlt);
      pendingSyncedTarget = new THREE.Vector3(tgtE, tgtN, tgtAlt);
      if (pcControls) {
        pcControls.pivot.set(tgtE, tgtN, tgtAlt);
        pcControls._mode = 'none';
      }
      window.__pcViewReady = true;
    };

    // --------------------------------------------------------------------
    // Custom navigation controls — port of the main tab's EarthLikeControls
    // (earth-controls.js) into Potree's Z-up UTM frame. Replaces
    // EarthControls entirely: left-drag orbits the surface point under the
    // cursor, right-drag grabs the ground plane, middle-drag is a free
    // screen-space pan, wheel zooms toward the cursor and NEVER no-ops
    // (pick -> bbox mid-plane -> current pivot).
    // --------------------------------------------------------------------
    class PCPointerControls {
      constructor(viewer) {
        this.viewer = viewer;
        this.view = viewer.scene.view;
        this.dom = viewer.renderer.domElement;
        this.pivot = new THREE.Vector3();
        this.enabled = true;
        this._inertia = { yaw: 0, pitch: 0, active: false };
        this._lastMoveTime = 0;
        this.pivotIndicator = this._buildIndicator();
        viewer.scene.scene.add(this.pivotIndicator);

        this._mode = 'none';            // none | orbit | pan | screenpan
        this._lastPx = { x: 0, y: 0 };
        this._downPx = { x: 0, y: 0, t: 0 };
        this._panStart = new THREE.Vector3();
        this._panStartPos = new THREE.Vector3();
        this._panPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        this._screenRef = 100;
        this._grabDepth = 100;
        this._pointerId = null;
        this._touch = {
          mode: 'none',                 // none | orbit | pinch
          pts: new Map(),
          pinchDist: 0,
          pinchMidPx: { x: 0, y: 0 },
          pinchPlane: new THREE.Plane(new THREE.Vector3(0, 0, 1), 0),
          pinchStart: new THREE.Vector3()
        };

        this._onPointerDown = this._pointerDown.bind(this);
        this._onPointerMove = this._pointerMove.bind(this);
        this._onPointerUp = this._pointerUp.bind(this);
        this._onWheel = this._wheel.bind(this);
        this.dom.addEventListener('pointerdown', this._onPointerDown);
        this.dom.addEventListener('pointermove', this._onPointerMove);
        this.dom.addEventListener('wheel', this._onWheel, { passive: false });
        window.addEventListener('pointerup', this._onPointerUp);
        window.addEventListener('pointercancel', this._onPointerUp);
        this._lastTick = performance.now();
        this._tick = this._update.bind(this);
        requestAnimationFrame(this._tick);
      }

      _buildIndicator() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#EE5007'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(32, 32, 6, 0, Math.PI * 2); ctx.fill();
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: new THREE.CanvasTexture(canvas), transparent: true,
          opacity: 0, depthTest: false
        }));
        sprite.renderOrder = 1000;
        sprite.visible = false;
        return sprite;
      }

      _showPivot() {
        this.pivotIndicator.position.copy(this.pivot);
        this.pivotIndicator.visible = true;
        this.pivotIndicator.material.opacity = 1;
        this._scaleIndicator();
      }

      _scaleIndicator() {
        const d = this.view.position.distanceTo(this.pivotIndicator.position);
        this.pivotIndicator.scale.setScalar(Math.max(0.3, d / 40));
      }

      _update(now) {
        const dt = Math.min(0.1, Math.max(0, (now - this._lastTick) / 1000));
        this._lastTick = now;
        if (this._inertia.active && this._mode === 'none') {
          const decay = Math.exp(-dt * 5.5);
          this._inertia.yaw *= decay;
          this._inertia.pitch *= decay;
          if (Math.abs(this._inertia.yaw) + Math.abs(this._inertia.pitch) < 0.02) {
            this._inertia.active = false;
          } else {
            this._applyOrbit(this.pivot, this._inertia.yaw * dt, this._inertia.pitch * dt);
          }
        }
        if (this._mode !== 'orbit' && this.pivotIndicator.visible) {
          this.pivotIndicator.material.opacity = Math.max(0, this.pivotIndicator.material.opacity - dt * 2.5);
          this._scaleIndicator();
          if (this.pivotIndicator.material.opacity === 0) this.pivotIndicator.visible = false;
        }
        requestAnimationFrame(this._tick);
      }

      _cam() { return this.viewer.scene.getActiveCamera(); }
      _px(e) { return { x: e.clientX, y: e.clientY }; }   // CSS px, DPR-independent
      _nms(px) {
        const r = this.dom.getBoundingClientRect();
        return { x: px.x - r.left, y: px.y - r.top };
      }
      _ndc(px) {
        const r = this.dom.getBoundingClientRect();
        return new THREE.Vector2(
          ((px.x - r.left) / r.width) * 2 - 1,
          -((px.y - r.top) / r.height) * 2 + 1
        );
      }
      _ray(px) {
        // three r124 (Potree's bundled lib): setFromCamera returns void —
        // never chain .ray off it.
        const rc = new THREE.Raycaster();
        rc.setFromCamera(this._ndc(px), this._cam());
        return rc.ray;
      }
      _bboxMidZ() {
        const pcs = this.viewer.scene.pointclouds;
        if (!pcs.length) return null;
        const bb = pcs[0].boundingBox.clone().applyMatrix4(pcs[0].matrixWorld);
        return (bb.min.z + bb.max.z) / 2;
      }
      _planeHit(px, plane, minDist) {
        const ray = this._ray(px);
        const denom = ray.direction.dot(plane.normal);
        if (Math.abs(denom) < 0.02) return null;    // ray ~parallel to plane
        // full point-plane form: t = -(n·o + c)/(n·d). Dropping n·o breaks at
        // UTM-scale origins (camera sits at ~(367k, 4.76M, 500)).
        const t = -(ray.origin.dot(plane.normal) + plane.constant) / denom;
        if (!isFinite(t) || t < (minDist ?? 0.5) || t > 200000) return null;
        return ray.origin.clone().add(ray.direction.clone().multiplyScalar(t));
      }
      // pick chain: GPU point pick -> bbox mid-plane -> current pivot. Never null.
      _anchor(px) {
        const pcs = this.viewer.scene.pointclouds;
        if (pcs.length) {
          try {
            const I = Potree.Utils.getMousePointCloudIntersection(
              this._nms(px), this._cam(), this.viewer, pcs, {});
            if (I && I.location) return I.location.clone();
          } catch (err) { /* pick can fail on empty octree regions */ }
          const mz = this._bboxMidZ();
          if (mz !== null) {
            const hit = this._planeHit(px, new THREE.Plane(new THREE.Vector3(0, 0, 1), -mz));
            if (hit) return hit;
          }
        }
        return this.view.getPivot();
      }

      _pointerDown(e) {
        if (!this.enabled) return;
        this._inertia.active = false;
        this.dom.setPointerCapture?.(e.pointerId);
        this.dom.focus && this.dom.focus();         // keep Esc key delivery

        if (e.pointerType === 'touch') {
          if (this._touch.pts.size >= 2) return;    // ignore 3rd+ fingers
          this._touch.pts.set(e.pointerId, this._px(e));
          if (this._touch.pts.size === 2) {
            const p = [...this._touch.pts.values()];
            this._touch.pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
            this._touch.pinchMidPx = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
            const a = this._anchor(this._touch.pinchMidPx);
            this._touch.pinchPlane.set(new THREE.Vector3(0, 0, 1), -a.z);
            const s = this._planeHit(this._touch.pinchMidPx, this._touch.pinchPlane);
            this._touch.pinchStart.copy(s || a);
            this._touch.mode = 'pinch';
          } else {
            this._touch.mode = 'orbit';
            this.pivot.copy(this._anchor(this._px(e)));
          }
          return;
        }

        this._pointerId = e.pointerId;
        this._downPx = { ...this._px(e), t: performance.now() };
        this._lastPx = this._px(e);

        if (e.button === 0) {
          this.pivot.copy(this._anchor(this._px(e)));
          this._showPivot();
          this._mode = 'orbit';
        } else if (e.button === 2) {
          if (this._inserting()) return;            // right-click => finish insertion
          const a = this._anchor(this._px(e));
          this._panPlane.set(new THREE.Vector3(0, 0, 1), -a.z);
          const s = this._planeHit(this._px(e), this._panPlane, 0.1);
          if (!s) { this._mode = 'none'; return; }
          this._panStart.copy(s);
          this._panStartPos.copy(this.view.position);
          this._mode = 'pan';
          e.preventDefault();
        } else if (e.button === 1) {
          if (this._inserting()) return;
          const a = this._anchor(this._px(e));
          this._screenRef = Math.max(0.5, this.view.position.distanceTo(a));
          this._mode = 'screenpan';
          e.preventDefault();
        }
      }

      _pointerMove(e) {
        if (!this.enabled) return;

        if (e.pointerType === 'touch') {
          if (!this._touch.pts.has(e.pointerId)) return;
          this._touch.pts.set(e.pointerId, this._px(e));
          if (this._touch.mode === 'pinch' && this._touch.pts.size === 2) {
            const p = [...this._touch.pts.values()];
            const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
            const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
            if (this._touch.pinchDist > 1 && dist > 1) {
              const target = this._anchor(this._touch.pinchMidPx);
              this._zoomTowards(target, this._touch.pinchDist / dist);
            }
            const cur = this._planeHit(mid, this._touch.pinchPlane, 0.1);
            if (cur) {
              const delta = this._touch.pinchStart.clone().sub(cur);
              if (delta.length() < 1000) this.view.position.add(delta);
            }
            this._touch.pinchStart.copy(cur || this._touch.pinchStart);
            this._touch.pinchDist = dist;
            this._touch.pinchMidPx = mid;
          } else if (this._touch.mode === 'orbit' && this._touch.pts.size === 1) {
            this._orbitDrag(e, 1.0);
          }
          return;
        }

        if (this._mode === 'none' || e.pointerId !== this._pointerId) return;
        const dx = e.clientX - this._lastPx.x;
        const dy = e.clientY - this._lastPx.y;
        this._lastPx = { x: e.clientX, y: e.clientY };
        if (dx === 0 && dy === 0) return;

        if (this._mode === 'orbit') {
          this._orbitDrag(e, 1.0, dx, dy);
        } else if (this._mode === 'pan') {
          const cur = this._planeHit(this._px(e), this._panPlane, 0.1);
          if (!cur) return;
          const delta = this._panStart.clone().sub(cur);
          const maxStep = Math.max(50, this.view.position.distanceTo(cur) * 2);
          if (delta.length() > maxStep) delta.setLength(maxStep);
          this.view.position.copy(this._panStartPos).add(delta);
        } else if (this._mode === 'screenpan') {
          const h = this.dom.clientHeight || 800;
          const fov = this._cam().fov || 60;
          const wpp = 2 * this._screenRef * Math.tan(THREE.MathUtils.degToRad(fov / 2)) / h;
          const right = new THREE.Vector3().setFromMatrixColumn(this._cam().matrixWorld, 0);
          const up = new THREE.Vector3().setFromMatrixColumn(this._cam().matrixWorld, 1);
          this.view.position.addScaledVector(right, -dx * wpp);
          this.view.position.addScaledVector(up, dy * wpp);
        }
      }

      _orbitDrag(e, gainScale, preDx, preDy) {
        const point = this._px(e);
        const dx = preDx !== undefined ? preDx : point.x - this._lastPx.x;
        const dy = preDy !== undefined ? preDy : point.y - this._lastPx.y;
        this._lastPx = point;
        if (dx === 0 && dy === 0) return;
        // Match the main mesh tab's viewport-relative orbit gain.
        // Deltas are NEGATED to match EarthLikeControls' sign convention
        // (earth-controls.js _applyOrbit): dragging right orbits the camera
        // left around the pivot, i.e. the scene appears to rotate WITH the
        // cursor, matching the mesh tab exactly.
        const h = this.dom.clientHeight || 800;
        const G = (Math.PI * 2 * 0.55 / h) * gainScale;
        const yaw = -dx * G;
        const pitch = -dy * G;
        this._applyOrbit(this.pivot, yaw, pitch);
        const timestamp = performance.now();
        const dt = Math.max(8, timestamp - this._lastMoveTime) / 1000;
        this._lastMoveTime = timestamp;
        this._inertia.yaw = yaw / dt;
        this._inertia.pitch = pitch / dt;
        this._showPivot();
      }

      _applyOrbit(pivot, yawDelta, pitchDelta) {
        const view = this.view;
        const offset = new THREE.Vector3().subVectors(view.position, pivot);
        const r = offset.length();
        if (r < 1e-6) return;

        // camera-right projected onto the XY plane (Potree world up = +Z)
        const RIGHT = new THREE.Vector3(
          Math.cos(view.yaw), Math.sin(view.yaw), 0);
        const curPitch = view.pitch;
        let pd = THREE.MathUtils.clamp(
          pitchDelta,
          (Math.max(curPitch, -Math.PI / 2) - Math.PI / 2 + 0.03) - curPitch,
          (Math.min(curPitch, Math.PI / 2) + Math.PI / 2 - 0.03) - curPitch
        );

        const q = new THREE.Quaternion()
          .setFromAxisAngle(new THREE.Vector3(0, 0, 1), yawDelta)
          .multiply(new THREE.Quaternion().setFromAxisAngle(RIGHT, pd));
        offset.applyQuaternion(q);
        // lookAt keeps the zero-roll yaw/pitch composition; radius untouched
        view.position.copy(pivot).add(offset);
        view.lookAt(pivot);
      }

      _pointerUp(e) {
        if (e.pointerType === 'touch') {
          this._touch.pts.delete(e.pointerId);
          if (this._touch.pts.size === 0) {
            this._touch.mode = 'none';
          } else if (this._touch.pts.size === 1 && this._touch.mode === 'pinch') {
            this._touch.mode = 'orbit';
            this.pivot.copy(this._anchor([...this._touch.pts.values()][0]));
          }
          return;
        }
        if (this._pointerId !== null && e.pointerId !== this._pointerId) return;

        const moved = Math.hypot(e.clientX - this._downPx.x, e.clientY - this._downPx.y);
        const dt = performance.now() - this._downPx.t;
        const wasDrag = moved >= 5 || dt >= 400 || this._mode !== 'pan';
        // right-click WITHOUT drag completes an active measurement/volume
        if (e.button === 2 && !wasDrag) {
          window.__pcApi.cancel();
        }
        if (this._mode === 'orbit') {
          const speed = Math.abs(this._inertia.yaw) + Math.abs(this._inertia.pitch);
          this._inertia.active = performance.now() - this._lastMoveTime < 60 && speed > 0.15;
        }
        this._mode = 'none';
        this._pointerId = null;
      }

      _zoomTowards(target, s) {
        const view = this.view;
        const offset = new THREE.Vector3().subVectors(view.position, target);
        let d = offset.length() * s;
        d = THREE.MathUtils.clamp(d, 0.1, 100000);
        // no-op guard: a pure "away" zoom on a degenerate offset is useless
        if (offset.lengthSq() < 1e-9 && s > 1) return;
        offset.setLength(d);
        // Dolly only: move the camera along the existing view ray without
        // touching orientation (matches EarthLikeControls._zoomTowards in the
        // main mesh tab). Calling view.lookAt(target) here previously forced
        // the camera to snap-reaim at whatever point was under the cursor on
        // every scroll tick, causing a visible "swim" instead of a smooth zoom.
        view.position.copy(target).add(offset);
      }

      _wheel(e) {
        if (!this.enabled) return;
        e.preventDefault();
        const px = this._px(e);
        const hit = this._anchor(px);
        const s = Math.pow(0.9, -e.deltaY / 100);   // 3 x 100 notches => ~0.73x
        this._zoomTowards(hit, s);
        this.pivot.copy(hit);                        // follow-up wheel keeps depth
      }

      _inserting() {
        return window.__pcApi && (insertionActive.m || insertionActive.v);
      }

      _blur() {
        this._mode = 'none';
        this._pointerId = null;
        this._touch.pts.clear();
        this._touch.mode = 'none';
        this._inertia.active = false;
      }
    }

    // Replace Potree's EarthControls with our pointer-event controls.
    // earthControls.update() still runs each frame (pivot indicator, speed
    // transitions); setControls keeps viewer.controls non-null for any of
    // Potree's internal getControls() consumers, we just remove its input.
    viewer.setControls(viewer.earthControls);
    viewer.inputHandler.removeInputListener(viewer.earthControls);
    if (viewer.earthControls?.pivotIndicator) viewer.earthControls.pivotIndicator.visible = false;
    const pcControls = new PCPointerControls(viewer);

    if (!EPT_URL) {
      pointCloudHealth.fail('not_configured', { retryable: false });
    } else {
    pointCloudHealth.beginLoad();
    Potree.loadPointCloud(EPT_URL, PROJECT_TITLE, (e) => {
      if (e.type === 'loading_failed') {
        pointCloudHealth.fail('metadata_failed');
        return;
      }
      const pc = e.pointcloud;
      const mat = pc.material;
      mat.size = 1;
      // Default FIXED sizing — no giant blobs at sparse octree edges.
      // Adaptive/attenuated stay available through __pcApi.setSizing().
      mat.pointSizeType = Potree.PointSizeType.FIXED;
      mat.minSize = 0.5;
      mat.maxSize = 50;
      mat.shape = Potree.PointShape.CIRCLE;
      mat.activeAttributeName = 'rgba';

      viewer.scene.addPointCloud(pc);
      const bounds = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
      const extent = bounds.getSize(new THREE.Vector3()).length();
      const syncedTargetIsRelevant = pendingSyncedTarget &&
        bounds.distanceToPoint(pendingSyncedTarget) <= Math.max(1, extent);
      if (!window.__pcViewReady || !syncedTargetIsRelevant) {
        viewer.fitToScreen(0.7);
        pendingSyncedTarget = view.getPivot().clone();
      }
      pcControls.pivot.copy(view.getPivot());

      const cam = viewer.scene.getActiveCamera();
      cam.near = 0.1; cam.far = 100000; cam.updateProjectionMatrix();

      pointCloudHealth.metadataReady();
      if (POINT_COUNT) cloudMeta.total = POINT_COUNT;
      renderStatus();
    });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html><head></head><body>
<div id="r">Loading...</div>
<script src="http://192.168.60.92:8090/potree/libs/three.js/build/three.min.js"></script>
<script src="http://192.168.60.92:8090/potree/build/potree/potree.js"></script>
<script>
window.addEventListener('load', function() {
  var el = document.getElementById('r');
  try {
    var p = window.Potree;
    if (!p) { el.textContent = 'Potree NOT on window'; return; }
    var keys = Object.keys(p);
    var vt = typeof p.Viewer;
    el.innerHTML = 'Potree keys: ' + keys.length + '<br>Viewer: ' + vt + '<br>THREE.REVISION: ' + (window.THREE ? window.THREE.REVISION : 'none');
    if (vt === 'function') {
      el.innerHTML += '<br><b style="color:green">SUCCESS - Viewer is a constructor</b>';
    } else {
      el.innerHTML += '<br><b style="color:red">FAIL - Viewer is ' + vt + '</b>';
      // Check which exports are missing
      var expected = ['Viewer','loadPointCloud','Utils','PointCloudTree'];
      var missing = expected.filter(function(k) { return !p[k]; });
      el.innerHTML += '<br>Missing: ' + missing.join(', ');
    }
  } catch(e) {
    el.textContent = 'Error: ' + e.message;
  }
});
</script>
</body></html>

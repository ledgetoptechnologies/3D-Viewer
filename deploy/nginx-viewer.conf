user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 33m;
  limit_req_zone $binary_remote_addr zone=redeem:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=share:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=asset_rate:10m rate=500r/s;
  limit_conn_zone $binary_remote_addr zone=assets:10m;
  upstream viewer_api { server viewer-api:8088; keepalive 32; }
  server {
    listen 8088;
    location = /api/v1/admin-sessions/redeem { limit_req zone=redeem burst=10 nodelay; proxy_pass http://viewer_api; include /etc/nginx/viewer-proxy-headers.conf; }
    location /api/share/ { limit_req zone=share burst=30 nodelay; proxy_pass http://viewer_api; include /etc/nginx/viewer-proxy-headers.conf; }
    location /api/v1/admin/uploads/ { proxy_request_buffering off; proxy_read_timeout 300s; proxy_pass http://viewer_api; include /etc/nginx/viewer-proxy-headers.conf; }
    location /session-assets/ { access_log off; limit_req zone=asset_rate burst=1000 nodelay; limit_conn assets 64; proxy_pass http://viewer_api; include /etc/nginx/viewer-proxy-headers.conf; }
    location /assets/ { access_log off; limit_req zone=asset_rate burst=1000 nodelay; limit_conn assets 64; proxy_pass http://viewer_api; include /etc/nginx/viewer-proxy-headers.conf; }
    location / { proxy_pass http://viewer_api; include /etc/nginx/viewer-proxy-headers.conf; }
    location /internal-assets/models/ { internal; alias /srv/models/; }
    location /internal-assets/webodm/ { internal; alias /srv/webodm/; }
    location /internal-assets/derivatives/ { internal; alias /srv/derivatives/; }
    location /internal-assets/terra/ { internal; alias /srv/terra/; }
  }
}

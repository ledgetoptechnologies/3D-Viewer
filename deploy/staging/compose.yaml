name: viewer-staging
services:
  viewer-api:
    image: ghcr.io/ledgetoptechnologies/3d-viewer@sha256:b05c724fd51fb8dfc88efd2870a1e6781c4a0d1499b271528f029b6d8bbc221f
    pull_policy: never
    restart: 'no'
    stop_grace_period: 2m
    init: true
    read_only: true
    user: 568:568
    group_add:
    - '1000'
    entrypoint:
    - /bin/sh
    - -ec
    - node /app/staging-storage-guard.cjs && exec docker-entrypoint.sh node server/index.js
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    cpus: '2.0'
    mem_limit: 1g
    env_file:
    - ./config/viewer.env
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
    - type: bind
      source: /mnt/ViewerStaging
      target: /app/storage
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/storage/data
      target: /app/storage/data
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/config/staging-storage-guard.cjs
      target: /app/staging-storage-guard.cjs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/AGENTS.md
      target: /app/AGENTS.md
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - node
      - scripts/container-healthcheck.js
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      viewer-private: {}
      viewer-edge:
        ipv4_address: 172.23.0.3
  viewer-proxy:
    image: nginx:alpine
    pull_policy: never
    restart: 'no'
    read_only: true
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    cpus: '0.5'
    mem_limit: 128m
    ports:
    - 192.168.50.90:8088:8443
    volumes:
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/config/nginx.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/config/tls.crt
      target: /etc/nginx/staging/tls.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/config/tls.key
      target: /etc/nginx/staging/tls.key
      read_only: true
      bind:
        create_host_path: false
    tmpfs:
    - /var/cache/nginx:rw,nosuid,nodev,size=32m
    - /var/run:rw,nosuid,nodev,size=8m
    depends_on:
      viewer-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'wget --no-check-certificate -q -O /dev/null --header=''Host: viewer-staging.ledgetopdroneservices.com''
        https://127.0.0.1:8443/api/v1/ready'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      viewer-private: {}
      viewer-edge:
        ipv4_address: 172.23.0.2
  viewer-worker:
    image: ghcr.io/ledgetoptechnologies/3d-viewer@sha256:b05c724fd51fb8dfc88efd2870a1e6781c4a0d1499b271528f029b6d8bbc221f
    pull_policy: never
    restart: 'no'
    stop_grace_period: 2m
    init: true
    read_only: true
    user: 568:568
    group_add:
    - '1000'
    entrypoint:
    - /bin/sh
    - -ec
    - node /app/staging-storage-guard.cjs && exec docker-entrypoint.sh node server/workerSupervisor.js
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1g
    env_file:
    - ./config/viewer.env
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
    - type: bind
      source: /mnt/ViewerStaging
      target: /app/storage
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/storage/data
      target: /app/storage/data
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/config/staging-storage-guard.cjs
      target: /app/staging-storage-guard.cjs
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/bkoltz/3d-viewer-staging/AGENTS.md
      target: /app/AGENTS.md
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - const D=require('node:sqlite').DatabaseSync;const d=new D('/app/storage/data/viewer.sqlite',{readOnly:true});const
        r=d.prepare("SELECT value FROM app_state WHERE key='processing_worker_heartbeat'").get();d.close();const
        h=r&&JSON.parse(r.value);process.exit(h&&h.enabled!==false&&Date.now()-Date.parse(h.at)<45000?0:1);
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      viewer-private: {}
      viewer-edge:
        ipv4_address: 172.23.0.4
    depends_on:
      viewer-api:
        condition: service_healthy
networks:
  viewer-private:
    internal: true
  viewer-edge:
    external: true
    name: viewer-staging_viewer-edge

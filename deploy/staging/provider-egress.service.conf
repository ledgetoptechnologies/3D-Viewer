[Unit]
# Docker restarts must stop and restart this supervised staging stack so its
# ExecStartPre reapplies the narrow DOCKER-USER/INPUT policy before containers.
PartOf=docker.service

[Service]
# Keep the existing storage guard first; the Viewer must not start if either
# mount validation or the provider-egress policy fails.
# Append to the verified existing storage preflight; do not clear preflights.
ExecStartPre=+/usr/local/sbin/viewer-provider-egress-guard apply
# Atomic configuration replacement must acquire fresh bind mounts, including
# Nginx's paired proxy secret. Recreate only this supervised Viewer project.
ExecStart=
ExecStart=/usr/bin/docker compose -f /home/bkoltz/3d-viewer-staging/compose.yaml up --force-recreate --no-color --abort-on-container-exit --exit-code-from viewer-api

<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ledge Top Viewer Workspace</title>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/workspace-management.css">
  <link rel="stylesheet" href="/workspace-transfers.css">
</head>
<body>
  <div id="workspace" class="workspace-shell">
    <aside class="workspace-nav" aria-label="Viewer workspace">
      <a class="workspace-brand" href="/workspace" aria-label="Ledge Top Viewer home">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="1" y="1" width="38" height="38" rx="9" fill="#151b22" stroke="#ee5007" stroke-width="2"/><text x="20" y="26" text-anchor="middle" font-family="Outfit,Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="16" letter-spacing=".5" fill="#fff">LT</text></svg>
        <span><strong>Ledge Top</strong><small>Viewer Workspace</small></span>
      </a>
      <nav id="workspace-navigation"></nav>
      <div class="workspace-nav-foot">
        <span class="health-dot" id="nav-health-dot"></span>
        <span id="nav-health-label">Connecting</span>
      </div>
    </aside>
    <main class="workspace-main">
      <header class="workspace-header">
        <button id="nav-toggle" class="icon-button" aria-label="Toggle navigation">☰</button>
        <div><p class="eyebrow">3D data operations</p><h1 id="page-title">Dashboard</h1></div>
        <div class="workspace-actions">
          <button class="secondary-button background-work-indicator" id="background-work-button" aria-label="Open background work; 0 active jobs">
            <span aria-hidden="true">↻</span><span>Background</span><strong id="background-work-count">0</strong>
          </button>
          <button class="secondary-button" id="refresh-button">Refresh</button>
          <button class="primary-button" id="new-project-button">New project</button>
        </div>
      </header>
      <section id="workspace-content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="workspace-modal" class="workspace-modal" aria-labelledby="workspace-modal-title">
    <div id="workspace-modal-content"></div>
  </dialog>
  <div id="workspace-toast" role="status"></div>
  <script type="module" src="/workspace-projects.js"></script>
</body>
</html>
